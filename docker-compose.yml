services:
  app:
    image: mahmoud403/sams-app:latest
    container_name: sams-app
    ports:
      - '3000:3000'
    env_file:
      - .env
    depends_on:
      - mongodb
      - redis
    restart: unless-stopped
    networks:
      - sams-net

  mongodb:
    image: mongo
    container_name: sams-mongodb
    ports:
      - '27017:27017'
    volumes:
      - mongo:/data/db
    env_file:
      - .env
    networks:
      - sams-net

  redis:
    image: redis:alpine
    container_name: sams-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    networks:
      - sams-net

  fastapi:
    image: eissa77/plagiarismproject:latest
    container_name: sams-fastapi
    ports:
      - "8000:8000"
    env_file:
      - .env
    networks:
      - sams-net
    command: uvicorn api:app --host 0.0.0.0 --port 8000

volumes:
  mongo: { }
  redis-data: { }

networks:
  sams-net:
    driver: bridge